<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Worker Reset</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: #0f172a;
    }

    main {
      width: min(100%, 28rem);
      padding: 1.5rem;
      border-radius: 1rem;
      background: #1e293b;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 1rem;
      color: #34d399;
      font-size: 1.5rem;
      line-height: 1.2;
    }

    #status {
      max-height: 16rem;
      overflow: auto;
      margin-bottom: 1rem;
      padding: 1rem;
      border-radius: 0.75rem;
      background: #334155;
      font: 0.875rem/1.5 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
    }

    .ok {
      color: #34d399;
    }

    .error {
      color: #f87171;
    }

    button,
    a {
      display: block;
      width: 100%;
      margin-top: 0.75rem;
      border: 0;
      border-radius: 0.75rem;
      padding: 0.9rem 1rem;
      color: #fff;
      font: inherit;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease;
    }

    button:active,
    a:active {
      transform: scale(0.98);
    }

    button:hover,
    a:hover {
      filter: brightness(1.08);
    }

    #resetBtn {
      background: linear-gradient(90deg, #ef4444, #ea580c);
      font-size: 1.05rem;
    }

    #checkBtn {
      background: #334155;
    }

    a {
      background: #059669;
    }
  </style>
</head>

<body>
  <main>
    <h1>Service Worker Reset</h1>

    <div id="status">
      <div>Cekam na akci...</div>
    </div>

    <button id="resetBtn" type="button">Vymazat vse a restartovat</button>
    <button id="checkBtn" type="button">Zkontrolovat stav</button>
    <a href="/">Zpet do aplikace</a>
  </main>

  <script>
    const statusDiv = document.getElementById('status');

    function log(message, isError = false) {
      const line = document.createElement('div');
      line.className = isError ? 'error' : 'ok';
      line.textContent = message;
      statusDiv.appendChild(line);
      statusDiv.scrollTop = statusDiv.scrollHeight;
    }

    function clearStatus() {
      statusDiv.textContent = '';
    }

    async function checkStatus() {
      clearStatus();
      log('Kontroluji Service Worker...');

      if (!('serviceWorker' in navigator)) {
        log('Service Worker neni podporovan.', true);
        return;
      }

      try {
        const registrations = await navigator.serviceWorker.getRegistrations();
        log(`Nalezeno registraci: ${registrations.length}`);

        registrations.forEach((registration, index) => {
          log(`Registrace #${index + 1}`);
          log(`Scope: ${registration.scope}`);
          log(`Active: ${registration.active ? 'ano' : 'ne'}`);
          log(`Waiting: ${registration.waiting ? 'ano' : 'ne'}`);
          log(`Installing: ${registration.installing ? 'ano' : 'ne'}`);
        });

        const cacheNames = await caches.keys();
        log(`Nalezeno cache: ${cacheNames.length}`);
        cacheNames.forEach((name) => log(`- ${name}`));
      } catch (error) {
        log(`Chyba: ${error.message}`, true);
      }
    }

    async function resetAll() {
      clearStatus();
      log('Zacinam mazani...');

      if (!('serviceWorker' in navigator)) {
        log('Service Worker neni podporovan.', true);
        return;
      }

      try {
        log('Mazu Service Worker registrace...');
        const registrations = await navigator.serviceWorker.getRegistrations();

        if (registrations.length === 0) {
          log('Zadne registrace nenalezeny.');
        } else {
          for (const registration of registrations) {
            await registration.unregister();
            log(`Odregistrovano: ${registration.scope}`);
          }
        }

        log('Mazu cache...');
        const cacheNames = await caches.keys();

        if (cacheNames.length === 0) {
          log('Zadna cache nenalezena.');
        } else {
          for (const name of cacheNames) {
            await caches.delete(name);
            log(`Vymazana: ${name}`);
          }
        }

        log('Mazu localStorage...');
        const itemCount = localStorage.length;
        localStorage.clear();
        log(`Vymazano polozek: ${itemCount}`);

        log('Hotovo. Zavrete vsechny taby s aplikaci a otevete ji znovu.');

        setTimeout(() => {
          log('Za 3 sekundy presmeruji zpet do aplikace...');
          setTimeout(() => {
            window.location.href = '/';
          }, 3000);
        }, 2000);
      } catch (error) {
        log(`Chyba: ${error.message}`, true);
      }
    }

    document.getElementById('checkBtn').addEventListener('click', checkStatus);
    document.getElementById('resetBtn').addEventListener('click', resetAll);
    checkStatus();
  </script>
</body>
</html>
